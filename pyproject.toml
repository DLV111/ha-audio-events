[project]
name = "ha-audio-events"
version = "0.1.0"
description = "Home Assistant add-on for audio event detection using TensorFlow Lite."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "paho-mqtt>=1.6",
  "tflite-runtime>=2.12.0,<3.0.0"
]
[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.22",
  "ruff>=0.0.281",
  "black>=24.3.0",
  "mypy>=1.9"
]

[project.scripts]
ha-audio-events = "app.main:main_sync"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
