[project]
name = "ha-audio-events"
version = "0.1.4"
description = "Home Assistant add-on for audio event detection using TensorFlow Lite."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.9",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "paho-mqtt>=2.1,<3.0",
  "ai-edge-litert>=2.1.0,<3.0.0"
]
[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.22",
  "ruff>=0.0.281",
  "black>=24.3.0",
  "mypy>=1.9"
]

[project.scripts]
ha-audio-events = "app.main:main_sync"
ha-audio-events-bump-version = "app.versioning:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["ha-audio-events"]
