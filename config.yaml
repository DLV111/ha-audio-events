model: yamnet
buffer_seconds: 3.0
audio:
  sample_rate: 16000
  channels: 1
  format: pcm_s16le
  source_path: /tmp/fixture.wav
activity:
  rms_threshold: 0.001
  peak_threshold: 0.001
  hold_time: 0.5
  silence_timeout: 5.0
classifier:
  threshold: 0.01
  max_results: 5
  include:
    - speech
    - dog
    - train
    - thunder
    - siren
  exclude:
    - music
    - silence
aggregation:
  start_confidence: 0.01
  sustain_confidence: 0.005
  switch_margin: 0.1
  switch_debounce_seconds: 1.0
  switch_min_observations: 2
  min_event_hold_seconds: 2.0
  end_timeout: 1.0
  silence_timeout_seconds: 5.0
  activation_delay_seconds: 0.0
  candidate_max_observation_gap_seconds: 2.0
homeassistant:
  enabled: false
mqtt:
  enabled: false
