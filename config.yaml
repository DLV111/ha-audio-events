name: HA Audio Events
slug: ha_audio_events
version: 0.1.1
description: Home Assistant add-on for audio event detection using TensorFlow Lite.
arch:
  - amd64
  - armv7
  - armhf
  - aarch64
startup: application
boot: auto
host_network: false
options:
  model: yamnet
  buffer_seconds: 3.0
  audio:
    sample_rate: 16000
    channels: 1
    format: pcm_s16le
  activity:
    rms_threshold: 0.04
    peak_threshold: 0.1
    hold_time: 2.0
  classifier:
    threshold: 0.8
    max_results: 5
    include:
      - train
      - dog
      - thunder
      - siren
      - speech
    exclude:
      - music
      - silence
  aggregation:
    start_confidence: 0.85
    end_timeout: 5.0
  homeassistant:
    enabled: true
    url: http://supervisor/homeassistant
    token: null
    entity_prefix: audio
  mqtt:
    enabled: false
    host: localhost
    port: 1883
    topic: audio/events
    discovery_prefix: homeassistant
logger: info
map:
  - config: /config
  - addons: /addons
  - ssl: /ssl
ports:
  1883: 1883
