name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  INSTALL_PYTHON_DEPENDENCIES: "pip install -e ".[dev]"

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          ${{ env.INSTALL_PYTHON_DEPENDENCIES }}

      - name: Run pytest
        run: |
          source .venv/bin/activate
          PYTHONPATH=ha-audio-events .venv/bin/pytest -v

      - name: Run ruff linting
        run: |
          source .venv/bin/activate
          PYTHONPATH=ha-audio-events .venv/bin/ruff check ha-audio-events/app/ tests/

      - name: Run black formatting check
        run: |
          source .venv/bin/activate
          PYTHONPATH=ha-audio-events .venv/bin/black --check ha-audio-events/app/ tests/

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          ${{ env.INSTALL_PYTHON_DEPENDENCIES }}

      - name: Build package
        run: |
          source .venv/bin/activate
          python -m build

      - name: Test package installation
        run: |
          source .venv/bin/activate
          pip install dist/ha_audio_events-0.1.9-py3-none-any.whl
          python -c "import ha_audio_events; print(f'Successfully imported: {ha_audio_events.__version__}')"
