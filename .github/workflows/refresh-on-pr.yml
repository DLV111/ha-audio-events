name: Graphify Index Refresh on PRs into main

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
    paths-ignore: ['graphify-out/**']
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: refresh-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: read

    steps:
    - name: Skip fork PRs
      if: github.event.pull_request.head.repo.full_name != github.repository
      id: skip-fork

    - name: Cache graphify
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: graphify-cache-${{ runner.os }}-${{ hashFiles('graphify.yaml') }}-${{ hashFiles('.graphifyignore') }}

    - name: Checkout repository
      if: steps.skip-fork.outputs.skip == 'true'
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 0

    - name: Setup Python
      if: steps.skip-fork.outputs.skip == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install graphifyy
      if: steps.skip-fork.outputs.skip == 'true'
      run: |
        pip install graphifyy==0.9.64

    - name: Setup git config
      if: steps.skip-fork.outputs.skip == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Check for changes
      if: steps.skip-fork.outputs.skip == 'true'
      id: changes
      run: |
        if git status --porcelain -- graphify-out/ | grep -q .; then
          echo "changes=true" >> $GITHUB_OUTPUT
        else
          echo "changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push if changed
      if: steps.changes.outputs.changes == 'true' && steps.skip-fork.outputs.skip == 'true'
      run: |
        git add graphify-out/graph.json
        git add graphify-out/GRAPH_REPORT.md
        git add graphify-out/graph.html
        git add graphify-out/.graphify_labels.json
        git add graphify-out/.graphify_labels.json.sig
        git add graphify-out/.graphify_root
        git add graphify-out/manifest.json
        git commit -m "auto: refresh graphify index on PR ${{ github.event.pull_request.number }}"
        git pull --rebase origin ${{ github.head_ref }}
        git push origin ${{ github.head_ref }}