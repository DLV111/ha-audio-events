name: Graphify Index Refresh on PRs

on:
  pull_request:
    branches: ["main", "develop"]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'graphify-out/**'
      - '.graphify/**'
  workflow_dispatch: {}

jobs:
  refresh:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    concurrency:
      group: refresh-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install graphifyy
        run: |
          python -m pip install --upgrade pip
          python -m pip install "graphifyy==0.9.64"

      - name: Refresh graph index
        run: graphify update .

      - name: Commit graph updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -f graphify-out

          if git diff --cached --quiet; then
            echo "No graphify updates to commit"
            exit 0
          fi

          git commit -m "auto: refresh graphify index"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
