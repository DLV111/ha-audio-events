name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version number (e.g., 0.1.10)'
        required: true
        default: '0.1.10'
      commit_message:
        description: 'Commit message for version bump'
        required: false
        default: 'chore: bump version to {version}'
      push_changes:
        description: 'Push changes to repository'
        required: true
        default: 'true'
        type: boolean

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Bump version
        run: |
          echo "Bumping version to ${{ github.event.inputs.version }}"
          python -m app.versioning ${{ github.event.inputs.version }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add pyproject.toml ha-audio-events/config.json
          git commit -m "${{ github.event.inputs.commit_message }}" || echo "No changes to commit"

      - name: Push changes
        if: ${{ github.event.inputs.push_changes == 'true' }}
        run: |
          git push origin HEAD:${{ github.ref }}

      - name: Create tag
        if: ${{ github.event.inputs.push_changes == 'true' }}
        run: |
          git tag v${{ github.event.inputs.version }}
          git push origin v${{ github.event.inputs.version }}

      - name: Output version
        run: |
          echo "Version bumped to ${{ github.event.inputs.version }}"
