name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version number (e.g., 0.1.10)'
        required: true
        default: '0.1.10'
      commit_message:
        description: 'Commit message for version bump'
        required: false
        default: 'chore: bump version to {version}'
      push_changes:
        description: 'Push changes to repository'
        required: true
        default: 'true'
        type: boolean

jobs:
  bump-version:
    runs-on: ubuntu-latest
    env:
      # Indirection through env vars keeps workflow inputs out of the shell
      # script itself (prevents injection from user-supplied input values).
      NEW_VERSION: ${{ github.event.inputs.version }}
      COMMIT_MESSAGE: ${{ github.event.inputs.commit_message }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump version
        # versioning.py is stdlib-only, so no dependency install is required.
        run: |
          echo "Bumping version to $NEW_VERSION"
          PYTHONPATH=ha-audio-events python -m app.versioning "$NEW_VERSION"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add pyproject.toml ha-audio-events/config.yaml
          git commit -m "${COMMIT_MESSAGE:-chore: bump version to $NEW_VERSION}" || echo "No changes to commit"

      - name: Push changes
        if: ${{ github.event.inputs.push_changes == 'true' }}
        run: |
          git push origin HEAD:${{ github.ref }}

      - name: Create tag
        if: ${{ github.event.inputs.push_changes == 'true' }}
        run: |
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      - name: Output version
        run: |
          echo "Version bumped to $NEW_VERSION"
