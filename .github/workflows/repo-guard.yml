name: Repository Guard

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  validate-addon-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install pyyaml packaging
      - name: Validate add-on manifest
        run: |
          source .venv/bin/activate
          PYTHONPATH=ha-audio-events .venv/bin/python -c "
          import sys
          sys.path.insert(0, 'ha-audio-events/app')
          from manifest import validate_manifest
          errors = validate_manifest('ha-audio-events/config.yaml')
          if errors:
              print('ERROR: Manifest validation failed:')
              for e in errors:
                  print(f'  - {e}')
              sys.exit(1)
          print('Manifest validation passed.')
          "
