name: HA Audio Events
slug: ha_audio_events
version: 0.4.0
description: Home Assistant add-on for audio event detection using TensorFlow Lite.
arch:
  - amd64
  - aarch64
startup: application
boot: auto
host_network: false
hassio_api: true
homeassistant_api: true
audio: true
audio_input: true
options:
  model: yamnet
  log_level: info
  buffer_seconds: 3.0
  audio:
    sample_rate: 16000
    channels: 1
    format: pcm_s16le
    source_path: null
  activity:
    rms_threshold: 0.04
    peak_threshold: 0.1
    hold_time: 2.0
  classifier:
    threshold: 0.8
    max_results: 5
    include:
      - train
      - dog
      - thunder
      - siren
      - speech
    exclude:
      - music
      - silence
  aggregation:
    start_confidence: 0.85
    end_timeout: 5.0
  homeassistant:
    enabled: true
    entity_prefix: audio
  mqtt:
    enabled: false
    host: localhost
    port: 1883
    topic: audio/events
    discovery_prefix: homeassistant
    username: null
    password: null
    tls: false
  webui:
    enabled: true
    host: 0.0.0.0
    port: 8099
    auth_token: null
schema:
  # Single-choice dropdowns: these values are fixed by the YAMNet pipeline,
  # so presenting them as free-text only invites broken configurations.
  model: list(yamnet)
  log_level: list(trace|debug|info|warning|error|fatal)
  buffer_seconds: float
  audio:
    sample_rate: list(16000)
    channels: list(1)
    format: list(pcm_s16le)
    source_path: str?
  activity:
    rms_threshold: float
    peak_threshold: float
    hold_time: float
  classifier:
    threshold: float
    max_results: int
    include:
      - str
    exclude:
      - str
  aggregation:
    start_confidence: float
    end_timeout: float
  homeassistant:
    enabled: bool
    entity_prefix: str
    # url/token intentionally not exposed: inside the add-on they are
    # provided automatically (http://supervisor/core + SUPERVISOR_TOKEN).
    # Kept in the schema so options saved by older versions still validate;
    # stale values are normalised by the app on startup.
    url: str?
    token: str?
  mqtt:
    enabled: bool
    host: str
    port: int
    topic: str
    discovery_prefix: str
    username: str?
    password: str?
    tls: bool
  webui:
    enabled: bool
    host: str
    port: int
    auth_token: str?
ingress: true
ingress_port: 8099
panel_icon: mdi:microphone
panel_title: "HA Audio Events"
logger: info
map:
  - type: homeassistant_config
    read_only: true
  - type: addons
    read_only: true
  - type: ssl
    read_only: true
